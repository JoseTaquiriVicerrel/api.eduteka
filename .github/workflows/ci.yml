name: CI

# ESTADO: DESACTIVADO. Solo se ejecuta a mano (Actions > CI > Run workflow).
# Para activarlo en cada push y pull request, borra `workflow_dispatch:` y descomenta el bloque
# de abajo. Guia completa en docs/deploy.md ("Activar CI/CD").
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Las pruebas arrancan una MongoDB en memoria: se guarda el binario descargado.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --omit=dev
      # Falla solo con vulnerabilidades CRITICAS de produccion. Las altas se revisan a mano:
      # algunas piden un salto de version mayor y no deben romper cada PR.
      - run: npm audit --omit=dev --audit-level=critical
