# Nginx delante de la API, detras de Cloudflare.
# Copiar a /etc/nginx/conf.d/api.eduteka.pe.conf. Requiere (una vez) generar los rangos de
# Cloudflare con deploy/update-cloudflare-ips.sh, que crea /etc/nginx/conf.d/cloudflare_realip.inc.
#
# Idea: Nginx solo cree en `CF-Connecting-IP` si la conexion viene de Cloudflare (set_real_ip_from),
# asi nadie puede falsear su IP llegando directo al servidor. Despues escribe esa IP en
# X-Forwarded-For SOBRESCRIBIENDO lo que traiga, y la API usa TRUST_PROXY=loopback.
#
# La web (Next) NO pasa por aqui: llama directo a Node (EDK_API_URL=http://127.0.0.1:3000) con la
# IP del visitante en X-Forwarded-For. Por este server, esa cabecera se perderia al sobrescribirla
# y todos los visitantes compartirian la IP del servidor en el rate limit. Ver docs/deploy.md 4.1.

# Los rangos de Cloudflare y la cabecera real_ip se incluyen en el contexto http.
include /etc/nginx/conf.d/cloudflare_realip.inc;

upstream eduteka_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# edk-realtime (src/realtime.js, unidad eduteka-realtime): el socket de los simulacros en vivo.
# Mientras ese proceso no este habilitado, apunta a 3000 (el socket sigue dentro de la API).
# Con varias replicas, `ip_hash` mantiene a cada cliente en la misma (lo pide el transporte polling).
upstream eduteka_realtime {
    server 127.0.0.1:3002;
}

server {
    listen 80;
    server_name api.eduteka.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.eduteka.pe;

    # Certificado de origen de Cloudflare (SSL/TLS "Full (strict)") o Let's Encrypt.
    ssl_certificate     /etc/ssl/cloudflare/api.eduteka.pe.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.eduteka.pe.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Comprobantes de pago de hasta 5 MB + el resto del multipart. El JSON esta limitado a 100 kB en la API.
    client_max_body_size 6m;
    server_tokens off;

    # Socket.IO (simulacros en vivo). Va ANTES de `location /`: el de abajo manda `Connection ""` y corta
    # el WebSocket. Necesita Upgrade y una lectura larga (las conexiones duran minutos u horas); Socket.IO
    # manda su propio ping cada 25 s, asi que la conexion nunca queda inactiva.
    location /api/v1/realtime/ {
        proxy_pass http://eduteka_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # SOBRESCRIBE, igual que abajo
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering       off;
    }

    location / {
        proxy_pass http://eduteka_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;   # SOBRESCRIBE: $remote_addr ya es la IP real (real_ip)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        # La IA de comprobantes (hasta 20 s) y las formulas (5 s) cuentan dentro de una peticion.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Nada de /storage ni de archivos ocultos desde fuera: la API sirve sus archivos por sus rutas.
    location ~ /\. { deny all; }
}
