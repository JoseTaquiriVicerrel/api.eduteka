# Redis de COLAS (BullMQ). Instancia aparte de la de cache/sesiones/pub-sub.
# Copiar a /etc/redis/redis-queue.conf (ver deploy/redis-queue.service y docs/deploy.md §Colas).
#
# Por que otra instancia: BullMQ guarda los trabajos como claves de Redis. Si la memoria se llena y
# Redis expulsa claves (allkeys-lru, volatile-lru...), se pierden trabajos o se corrompen colas. Con
# `noeviction` Redis rechaza escrituras nuevas en vez de borrar: un encolado falla de forma visible y
# nada en vuelo desaparece. La cache, en cambio, SI necesita expulsar: por eso no comparten instancia.

bind 127.0.0.1 -::1
port 6380
protected-mode yes
# Cambiar por una clave larga y ponerla en QUEUE_REDIS_PASSWORD (api_eduteka y monolito).
requirepass CAMBIAR_POR_UNA_CLAVE_LARGA

# Memoria: las colas son pequenas (cargas utiles de ids, no documentos). 256 MB sobra con margen.
maxmemory 256mb
maxmemory-policy noeviction

# Persistencia: un trabajo encolado no debe perderse si Redis se reinicia.
appendonly yes
appendfsync everysec
dir /var/lib/redis-queue
dbfilename dump.rdb
appendfilename "appendonly.aof"
save 900 1
save 300 100

# Sin modulos: BullMQ no necesita RedisJSON ni RediSearch.
supervised systemd
daemonize no
logfile ""
loglevel notice

# Conexiones: realtime, scheduler, worker, docs y los productores de la API y del monolito
# abren pocas cada uno (BullMQ usa una normal y una bloqueante por Worker).
maxclients 1000
timeout 0
tcp-keepalive 60
